schema_version: 1
name: bouncer-gws
version: 0.1.0
description: |
  Bouncer API specs for Google Workspace — Gmail, Calendar, Drive,
  Docs, and Sheets.
apis:
  - apis/

service:
  slug: google
  title: Google Workspace
  description: |
    Gmail, Drive, Calendar, Docs, and Sheets. Issues bouncer-bearer
    JWTs that wrap your OAuth2 access (or refresh) token.

# Bring-your-own-token variants. The tokens screen renders one form
# per variant and emits a copy-pasteable bouncer JWT.
token:
  - id: access_token
    title: Access token
    description: |
      Paste a short-lived OAuth2 access token. Convenient for one-
      off explorations; the issued JWT expires when the upstream
      token does (typically one hour). Use the refresh-token variant
      for any durable deployment.
    fields:
      - name: access_token
        label: Access token
        kind: secret
        placeholder: ya29...
        required: true

  - id: refresh_token
    title: Refresh token + client
    description: |
      Paste the long-lived OAuth2 refresh token plus the matching
      client_id and client_secret. The bouncer /token endpoint
      transparently rotates upstream access tokens for clients.
    refresh:
      token_url: https://oauth2.googleapis.com/token
    fields:
      - name: refresh_token
        label: Refresh token
        kind: secret
        placeholder: "1//0g..."
        required: true
      - name: client_id
        label: Client ID
        kind: text
        placeholder: ....apps.googleusercontent.com
        required: true
      - name: client_secret
        label: Client secret
        kind: secret
        required: true
