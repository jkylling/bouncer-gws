---
# Google Docs API v1 — https://developers.google.com/docs/api/reference/rest
#
# Docs has a single `documents` resource. Everything else (body content,
# suggestions, lists, headers/footers, footnotes, named styles) lives
# inside the document and is manipulated via `documents.batchUpdate`
# sub-requests — there's no separate endpoint to authorize on.

name: google.docs
base_url: "https://docs.googleapis.com"
path_prefixes:
- /v1/documents

meta:
- name: document
  kind: endpoint
  input:
  # `id` rather than `document_id` — proto would normalize to `documentId`
  # and collide with the output field.
  - name: id
  request: get('/v1/documents/' + string(input.id))
  output:
  - name: documentId
    expr: response.body.documentId
  - name: title
    expr: response.body.title
  # `suggestionsViewMode` is one of DEFAULT_FOR_CURRENT_ACCESS /
  # SUGGESTIONS_INLINE / PREVIEW_SUGGESTIONS_ACCEPTED /
  # PREVIEW_WITHOUT_SUGGESTIONS.
  - name: suggestionsViewMode
    expr: response.body.?suggestionsViewMode

actions:
- name: create_document
  method: POST
  path: /v1/documents

- name: get_document
  method: GET
  path: /v1/documents/{id}
  binds:
    - |
      document{ id: match.id }
    - |
      google.drive.file{ file_id: match.id }

- name: batch_update_document
  method: POST
  path: /v1/documents/{id}/batchUpdate
  binds:
    - |
      document{ id: match.id }
    - |
      google.drive.file{ file_id: match.id }

# Documentation-only starter policies. The Docs spec binds
# `google.drive.file{file_id: match.id}` on every action, so the gating
# conditions read Drive's metadata fields directly even though we
# live in the docs API namespace. See google.gmail.yaml's top-of-block
# comment for the gating-model rationale, and google.drive.yaml's notes on
# direct-parent-only matching.
#
# == Substitution placeholders ==========================================
#
#   <AGENT_FOLDER_ID>  Drive folder ID — same value as the Drive
#                      API's <AGENT_FOLDER_ID>. Documents directly
#                      inside the folder get RW; documents the
#                      caller owns (anywhere) get read.
#
# == Out of scope =======================================================
#
# `create_document` is intentionally not covered. The Docs API
# doesn't accept a parent folder at create time — new documents
# land loose in `My Drive` and need a follow-up Drive `update_file`
# with `addParents=<AGENT_FOLDER_ID>` to land in the folder. That
# move IS covered by Drive's `agent_folder_create` plus the
# operator's chosen create-step pattern. Until the operator settles
# on a wiring (open create + immediate move, or per-instance
# proposal), `create_document` stays denied by default.
