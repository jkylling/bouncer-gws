# Documentation-only starter policies. Same shape and substitution
# rules as google.gmail.yaml — see that file's top-of-block comment for
# the gating-model rationale; the Drive set re-uses two of the same
# trust signals (folder placement, file ownership).
#
# == Substitution placeholders ==========================================
#
#   <AGENT_FOLDER_ID>  Drive folder ID (e.g. `1AbC2dE3...`) the
#                      operator hands the agent. Files placed
#                      directly in this folder are agent-scoped;
#                      files anywhere else aren't covered by the
#                      folder gate.
#
# == What's deliberately out of scope ===================================
#
# - Drive's `parents` field is the file's DIRECT parent only — Drive
#   doesn't surface ancestry on a file resource. So the folder gate
#   matches direct children of <AGENT_FOLDER_ID>; subfolder contents
#   need either a separate policy per subfolder ID or a future
#   ancestor-walking meta. Operators wanting deeper nesting today
#   typically wire a second policy with the same condition shape but
#   a different folder ID.
# - `permissions.*` (sharing) is a privilege-escalation surface —
#   adding a permission can quietly grant external readers — and
#   stays per-instance via the proposals flow.
# - `revisions.*` and `drives.*` (shared drives administration) are
#   also operator-tier and not covered.
