      mailbox{ user_id: match.user_id }

# Documentation-only starter policies. Surfaced via `/_api/apis` and
# the `/_admin/apis` viewer; the runtime ignores them.
#
# == The "agent-owned" gating model =====================================
#
# Every recipe below answers one question: is this resource agent-owned?
# A "yes" permits the operation; a "no" leaves the request to the next
# policy (which, with no fallback, denies). Two mechanisms identify
# ownership, used either alone or as a disjunction:
#
#   1. Gmail label.
#      The agent — or the operator — applies a per-deployment label to
#      every resource the agent should touch. `<LABEL_ID>` is the
#      label's stable ID (e.g. `Label_1234567890`, retrievable via
#      `users.labels.list`). Works for messages and threads.
#
#   2. RFC-5322 header in the raw message body.
#      The agent stamps a custom header on every message it composes
#      (e.g. `X-Agent-Author: claude`). Bouncer's `message` /
#      `draft.message` binds expose `payload.headers`, so the policy
#      checks for `(name, value)` pair presence:
#
#        message.headers.exists(h,
#          h.name == "X-Agent-Author" && h.value == "claude")
#
#      Replace `<TRUSTED_HEADER>` and `<TRUSTED_HEADER_VALUE>` with the
#      pair your mail composition pipeline writes. The value is part of
#      the gate — meaning a different agent can't swap their identifier
#      in and inherit the same permissions.
#
# == Why both mechanisms ================================================
#
# Labels are the natural identity primitive for messages/threads
# (durable, indexable, visible in the UI). For drafts the situation
# is split: the agent itself can't self-label a draft via the
# drafts API in the way it can with messages (Google issuetracker
# 194804420 covers the drafts-update labelling restriction), so the
# agent-trust signal for drafts is the header it stamps in the raw
# RFC-5322 body it composes. But labels CAN be applied to a draft's
# underlying message id by an external actor (a reviewer step using
# `users.messages.modify`, an admin UI button, the proposals
# approval flow), and that's the mechanism `send_authorized_drafts`
# below relies on.
#
# == Per-resource shape =================================================
#
# Each entry's `action:` is a CEL predicate over `action.name`, so a
# single suggestion covers several actions when they share a bind —
# e.g. all `users.messages.*` ops that take a `message_id` resolve
# the same `message{...}` bind, so the same `message.labelIds` /
# `message.headers` condition gates them uniformly. Conversely,
# every recipe with a distinct condition stays its own policy; we
# never split a single condition across multiple rules.
#
# == Send is its own gate ===============================================
#
# `send_draft` actually delivers mail as the user — irreversible from
# the recipient's inbox once it lands, and the highest-blast-radius
# action on this surface. We deliberately do NOT cover it with the
# same trust signal that gates draft read/update: an agent that can
# author + edit a draft should still need a separate, explicit signal
# before its drafts can leave the outbox.
#
# The `send_authorized_drafts` recipe below gates on a dedicated
# <SEND_LABEL_ID> applied to the draft's underlying message — the
# label is added by a human-in-the-loop step (a reviewer button, a
# separate MCP tool, the proposals approval flow) AFTER the draft
# body is final, and the agent itself can't write it. The label is
# the load-bearing safety property: a compromised compose pipeline
# can flood the drafts folder but not the recipient's inbox.
#
# == Substitution placeholders ==========================================
#
#   <LABEL_ID>              agent-ownership label ID for messages
#                           and threads, e.g. `Label_1234567890`.
#   <TRUSTED_HEADER>        author-trust header name,
#                           e.g. `X-Agent-Author`.
#   <TRUSTED_HEADER_VALUE>  literal header value, e.g. `claude`. Pick
#                           something specific to the agent identity,
#                           not a generic "true".
#   <SEND_LABEL_ID>         send-authorisation label ID, distinct
#                           from <LABEL_ID>, e.g. `Label_9876543210`.
#                           Applied to a draft's underlying message
#                           by a human approval step before
#                           `send_draft` is allowed.
